<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Mushroom Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <script src="/js/pagination.js" defer></script>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">
            <i class="fas fa-mushroom text-primary me-2"></i><span class="text-gradient">Marias Organics</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto ms-4">
                <li class="nav-item" sec:authorize="hasRole('ACCOUNTANT') or hasRole('SUPERVISOR') or hasRole('ADMIN')">
                    <a class="nav-link" href="/dashboard"><i class="fas fa-chart-pie me-1"></i>Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/my-expenses"><i class="fas fa-receipt me-1"></i>Expenses</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/my-incomes"><i class="fas fa-coins me-1"></i>Income</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/capital"><i class="fas fa-landmark me-1"></i>Capital</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/loans"><i class="fas fa-hand-holding-usd me-1"></i>Loans</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('SUPERVISOR') or hasRole('ACCOUNTANT') or hasRole('ADMIN')">
                    <a class="nav-link" href="/approvals"><i class="fas fa-check-double me-1"></i>Approvals</a>
                </li>
                <li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-cog me-1"></i>Admin
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/admin/approvals">All Approvals (Exp &amp; Inc)</a></li>
                        <li><a class="dropdown-item" href="/admin/income-approvals">Income Approvals</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="/admin/users">Users</a></li>
                        <li><a class="dropdown-item" href="/admin/categories">Categories</a></li>
                        <li><a class="dropdown-item" href="/admin/subcategories">SubCategories</a></li>
                    </ul>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-3">
                <div class="d-flex align-items-center text-muted">
                    <i class="fas fa-user-circle me-2"></i>
                    <span sec:authentication="name" class="fw-medium">User</span>
                </div>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill px-3">Logout</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div th:fragment="footer" class="container mt-5 mb-4 text-center text-muted">
    <small class="opacity-75">&copy; 2025 Mushroom Farm Expense Tracker. All rights reserved.</small>
</div>

<script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:fragment="htmx" src="https://unpkg.com/htmx.org@1.9.10"></script>

</body>
</html>
